<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eFCS iframe / popup 範例</title>
  <style>body{font:16px system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem}button{padding:.5rem;margin:.4rem}iframe{width:100%;height:900px;border:1px solid #aaa}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem}[role=alert]{color:#a00}</style>
</head>
<body>
  <h1>eFCS 表單 iframe / popup 範例</h1>
  <p>需與 eFCSPay 同源或由已設定 CORS 的來源提供。子頁表單支援 T101/T102/T112/T201。</p>
  <button id="showFrame">在 iframe 顯示表單</button>
  <button id="openPopup">在新視窗開啟表單</button>
  <p id="status" aria-live="polite"></p><p id="error" role="alert"></p>
  <section id="frameContainer" hidden><h2>iframe 表單</h2><iframe id="efcsFrame" title="eFCS 電文表單"></iframe></section>
  <h2>收到的交易回應</h2><pre id="result">尚未收到回應</pre>
  <script>
    const frame = document.getElementById("efcsFrame");
    let popup = null;
    document.getElementById("showFrame").addEventListener("click", () => {
      document.getElementById("frameContainer").hidden = false;
      frame.src = "./form.html?embedded=1";
    });
    document.getElementById("openPopup").addEventListener("click", () => {
      popup = window.open("./form.html?popup=1", "efcsForm", "popup,width=1000,height=900,resizable=yes,scrollbars=yes");
      if (!popup) document.getElementById("error").textContent = "新視窗遭瀏覽器封鎖，請允許此網站開啟 popup。";
    });
    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) return;
      const isFrame = frame.contentWindow && event.source === frame.contentWindow;
      const isPopup = popup && event.source === popup;
      if (!isFrame && !isPopup) return;
      if (event.data?.type === "EFCS_RESULT") {
        document.getElementById("status").textContent = `${event.data.prsCode} 完成`;
        document.getElementById("error").textContent = "";
        document.getElementById("result").textContent = JSON.stringify(event.data.response, null, 2);
      } else if (event.data?.type === "EFCS_ERROR") {
        document.getElementById("error").textContent = event.data.message || "電文處理失敗";
      }
    });
  </script>
</body>
</html>
