<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eFCS 分頁展示（Axios）</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    label, button { margin-right: .5rem; } table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .5rem; text-align: left; }
    [role=alert] { color: #b00020; }
  </style>
</head>
<body>
  <h1>eFCS 分頁展示（HTML + Axios）</h1>
  <label for="code">交易類型</label>
  <select id="code"><option value="T101">T101 查詢</option><option value="T102">T102 繳費</option></select>
  <button id="submit">送出</button>
  <p id="status" aria-live="polite"></p>
  <p id="error" role="alert"></p>
  <section id="results" hidden>
    <p id="count"></p>
    <table><thead id="head"></thead><tbody id="rows"></tbody></table>
    <button id="more" hidden>下一頁</button>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script>
    const endpoint = "/api/messages";
    const pageSize = 5;
    const fields = {
      T101: [["queryDetailNo", "明細號"], ["queryBillData", "帳單資料"], ["queryAmount", "金額"], ["queryDate", "日期"]],
      T102: [["detailNo", "明細號"], ["billData", "帳單資料"], ["txnAmount", "金額"], ["rtnCodeDesc", "結果"]]
    };
    let allRows = [];
    let visibleCount = pageSize;
    const el = (id) => document.getElementById(id);
    const dateTime = () => new Date().toISOString().replace(/[-:TZ.]/g, "").slice(0, 14);

    function buildRequest(code) {
      const time = dateTime();
      const HEAD = { txnChannel: "WEB", prsCode: code, txnDataTime: time, txnNo: `WEB-${time}`,
        billerId: "BILLER001", bTypeClass: "", icChkCode: "", icChkDesc: "" };
      if (code === "T101") return { HEAD, BODY: { queryType: "01", queryData1: "A001",
        queryData2: "", queryData3: "", queryData4: "", queryData5: "", eBillSn: "", outBankId: "", key: "" } };
      return { HEAD, BODY: { PAYHEAD: { pendingNo: "MOCK-PENDING-001", pendingNotAfter: "",
        totalCount: 1, totalAmount: 100, totalFee: 0, outBankId: "", memberId: "MEMBER001",
        payDatetime: time, checkType: "", billType: "01", deviceId: "", carrierType: "",
        carrierNo: "", mobile: "", accountNo: "", cardNo: "", merchantId: "", mccCode: "",
        terminal: "", email: "", querySeqNo: "" }, PAYDETAIL: [{ detailNo: "1", txnAmount: 100,
        billData: "MOCK-BILL-1", billBatch: "001" }], key: "" } };
    }

    function render(code) {
      const columns = fields[code];
      el("head").replaceChildren();
      const headerRow = document.createElement("tr");
      columns.forEach(([, title]) => { const th = document.createElement("th"); th.textContent = title; headerRow.append(th); });
      el("head").append(headerRow);
      el("rows").replaceChildren();
      allRows.slice(0, visibleCount).forEach((row) => {
        const tr = document.createElement("tr");
        columns.forEach(([key]) => { const td = document.createElement("td"); td.textContent = String(row[key] ?? "-"); tr.append(td); });
        el("rows").append(tr);
      });
      el("count").textContent = `共 ${allRows.length} 筆；eFCSPay 已追蹤主機分頁至 key=END。`;
      el("more").hidden = visibleCount >= allRows.length;
      el("results").hidden = false;
    }

    el("submit").addEventListener("click", async () => {
      const code = el("code").value;
      el("error").textContent = ""; el("status").textContent = "查詢中…";
      el("results").hidden = true; el("submit").disabled = true;
      try {
        const { data } = await axios.post(`${endpoint}/${code}`, buildRequest(code), {
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          timeout: 30000
        });
        if (data.HEAD?.prsCode !== code) throw new Error("Response HEAD.prsCode 不符合請求");
        if (data.BODY?.key !== "END") throw new Error('預期 eFCSPay 彙整回應的 BODY.key="END"');
        const detailKey = code === "T101" ? "QUERYDETAIL" : "PAYDETAIL";
        if (!Array.isArray(data.BODY[detailKey])) throw new Error(`BODY.${detailKey} 格式錯誤`);
        allRows = data.BODY[detailKey]; visibleCount = pageSize; render(code);
        el("status").textContent = "查詢完成。";
      } catch (error) {
        const message = axios.isAxiosError(error)
          ? (error.response?.data?.message || error.message)
          : error instanceof Error ? error.message : "未知錯誤";
        el("error").textContent = message;
        el("status").textContent = "";
      } finally { el("submit").disabled = false; }
    });
    el("more").addEventListener("click", () => { visibleCount += pageSize; render(el("code").value); });
  </script>
</body>
</html>
